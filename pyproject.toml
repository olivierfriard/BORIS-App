[project]
name = "boris-app"
version = "0.13"
description = "BORIS App for Android"
authors = [
    { name = "Olivier Friard", email = "olivier.friard@unito.it" }
]
dependencies = [
    "kivy>=2.3.0",
    "requests==2.34.2",
    "kivymd>=1.2.0",
    "plyer>=2.1.0",
    "kivy-garden>=0.1.5",
    "setuptools==83.0.0",
    "pip>=25.3",
    "cython==0.29.33",
    "urllib3==2.8.0",
    "pygments==2.20.0",
    "pillow==13.0.0",
    "sh==2.2.4",
    "virtualenv==21.15.0",
    "certifi==2026.10.23",
    "filelock==4.2.4",
]
readme = "README.md"
requires-python = ">= 3.11,<3.12"

[dependency-groups]
dev = [
    "buildozer>=1.5.0",
]

